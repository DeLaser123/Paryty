[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "paryty-intelligence"
version = "1.0.0"
description = "Paryty Intelligence Layer — ML forecasting and anomaly detection"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "scikit-learn>=1.3.0",
    "prophet>=1.1.5",
    "xgboost>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "statsmodels>=0.14.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "confluent-kafka>=2.3.0",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "grpcio-testing>=1.60.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
paryty-intel = "intelligence.server.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
