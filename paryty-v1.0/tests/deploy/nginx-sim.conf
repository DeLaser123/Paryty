# Nginx configuration for simulated services
# Routes requests to backend services based on path

upstream api_gateway {
    server api-gateway:80;
}

server {
    listen 80;
    server_name localhost;

    # Health check
    location /health {
        return 200 '{"status":"healthy","service":"nginx"}';
        add_header Content-Type application/json;
    }

    # API routes
    location /api/users {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/orders {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/payments {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Default
    location / {
        return 200 '{"service":"nginx","routes":["/api/users","/api/orders","/api/payments","/health"]}';
        add_header Content-Type application/json;
    }
}
