# Paryty Agent Configuration — Default (local development)

agent:
  id: "auto"
  cluster_endpoint: "localhost:50052"
  api_key: "pk_live_27e00f019ed5bdcc74e984a7ad947bf531165ff98acf6acf3d6d956e4d6ee200"
  self_metrics:
    enabled: true
    port: 9100

layers:
  metal:
    enabled: true
    interval: "10s"
    cpu_per_core: true
    cpu_per_process: true
    memory_rss: true
    disk_io: true
    network_io: true
    process_tree: true
    container_detection: true

  ebpf:
    enabled: false
    tcp_connections: false
    dns_resolution: false
    http_inspection: false
    db_inspection: false
    exclude_ports: [22, 53, 443]
    exclude_ips: ["127.0.0.1", "::1"]
    ring_buffer_size_kb: 256
    poll_interval_ms: 100
    fallback_to_proc: true

  supervisor:
    enabled: false
    health_checks: []
    log_tailing: []

communication:
  protocol: grpc
  tls:
    enabled: false
  compression: zstd
  edge_buffer:
    enabled: true
    max_size_mb: 100
    retention_hours: 24
  flow_control:
    backpressure_enabled: true
    adaptive_sampling: true
    priority_queues:
      - name: "critical"
        topics: ["alerts", "errors"]
        priority: 1
      - name: "normal"
        topics: ["metrics", "traces"]
        priority: 2

logging:
  level: info
  format: json
  output: stdout
