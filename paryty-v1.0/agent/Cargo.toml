[package]
name = "paryty-agent"
version = "0.1.0"
edition = "2021"
authors = ["Paryty Team"]
description = "Paryty Agent - Hyper-light observability collector"
license = "Proprietary"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"

# gRPC
tonic = { version = "0.11", features = ["tls", "tls-webpki-roots"] }
prost = "0.12"
prost-types = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Metrics collection (cross-platform)
sysinfo = "0.30"

# Compression
zstd = "0.13"

# Edge buffer (SQLite)
rusqlite = { version = "0.31", features = ["bundled"] }
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Fast random number generation (for jitter)
fastrand = "2"

# Configuration
config = "0.14"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Networking
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# Buffer management
bytes = "1"

# URL parsing
url = "2"

# Regex
regex = "1"

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.16"
libc = "0.2"
# eBPF: libbpf-rs for loading C eBPF programs (replaces aya)
libbpf-rs = "0.23"
libbpf-sys = "1.4"
# Zero-copy struct parsing from eBPF ring buffers
plain = "0.2"

[dev-dependencies]
# Property-based testing
proptest = "1"
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
# Temporary directories for tests (edge buffer, tenant cache)
tempfile = "3"

[build-dependencies]
tonic-build = "0.11"
which = "7"
# C eBPF program compilation (Linux only, skipped on other platforms)
cc = "1.0"

[[bin]]
name = "paryty-agent"
path = "src/main.rs"

[lib]
name = "paryty_agent"
path = "src/lib.rs"
