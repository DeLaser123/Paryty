# Paryty DestinationRules — mTLS for all Paryty services
#
# Each DestinationRule enforces ISTIO_MUTUAL TLS mode for its
# corresponding Kubernetes Service. This ensures that every pod
# communicates with every other pod over mutually authenticated TLS.
#
# The default rule (host: "*.paryty.svc.cluster.local") is a catch-all
# for any services not explicitly listed below. Per-service rules
# override the default for traffic policy tuning (connection pool
# sizes, outlier detection, load balancing).
#
# References:
#   - Istio DestinationRule TLS mode
#   - Architecture rule: "TLS for all network communication"

apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: paryty-default-mtls
  namespace: paryty
  labels:
    app.kubernetes.io/name: paryty
    app.kubernetes.io/part-of: paryty
    app.kubernetes.io/component: service-mesh
spec:
  # Default for all services in the paryty namespace
  host: "*.paryty.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: paryty-ingestion
  namespace: paryty
  labels:
    app.kubernetes.io/name: paryty
    app.kubernetes.io/part-of: paryty
    app.kubernetes.io/component: service-mesh
spec:
  host: paryty-ingestion.paryty.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 10000
      http:
        http1MaxPendingRequests: 1000
        http2MaxRequests: 1000
        maxRequestsPerConnection: 1
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
---
