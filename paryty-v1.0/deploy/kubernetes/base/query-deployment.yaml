apiVersion: apps/v1
kind: Deployment
metadata:
  name: paryty-query
  labels:
    app.kubernetes.io/component: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/component: query
    spec:
      containers:
        - name: query
          image: paryty/query:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: paryty-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
