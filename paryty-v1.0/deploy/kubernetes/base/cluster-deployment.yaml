apiVersion: apps/v1
kind: Deployment
metadata:
  name: paryty-cluster
  namespace: paryty
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paryty-cluster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paryty-cluster
    spec:
      serviceAccountName: paryty-cluster
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paryty-cluster
          image: ghcr.io/paryty/paryty-cluster:latest
          ports:
            - name: grpc
              containerPort: 443
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: paryty-config
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
