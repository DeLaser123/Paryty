apiVersion: apps/v1
kind: Deployment
metadata:
  name: paryty-correlator
  labels:
    app.kubernetes.io/component: correlator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: correlator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: correlator
    spec:
      containers:
        - name: correlator
          image: paryty/correlator:latest
          envFrom:
            - configMapRef:
                name: paryty-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep paryty-correlator"
            initialDelaySeconds: 10
            periodSeconds: 15
