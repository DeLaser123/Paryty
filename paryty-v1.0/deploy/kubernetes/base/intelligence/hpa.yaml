apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paryty-intelligence
  labels:
    app.kubernetes.io/component: intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paryty-intelligence
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
