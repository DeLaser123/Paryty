apiVersion: apps/v1
kind: Deployment
metadata:
  name: paryty-ingestion
  labels:
    app.kubernetes.io/component: ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ingestion
    spec:
      containers:
        - name: ingestion
          image: paryty/ingestion:latest
          ports:
            - containerPort: 8080
              name: grpc
            - containerPort: 8081
              name: health
          envFrom:
            - configMapRef:
                name: paryty-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: ingestion
