apiVersion: apps/v1
kind: Deployment
metadata:
  name: paryty-aggregator
  labels:
    app.kubernetes.io/component: aggregator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: aggregator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: aggregator
    spec:
      containers:
        - name: aggregator
          image: paryty/aggregator:latest
          envFrom:
            - configMapRef:
                name: paryty-config
          env:
            - name: AGGREGATION_WINDOW
              value: "1m"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep paryty-aggregator"
            initialDelaySeconds: 10
            periodSeconds: 15
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: aggregator
