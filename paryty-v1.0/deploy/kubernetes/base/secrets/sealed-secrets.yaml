# Sealed Secrets for Paryty
# This file contains encrypted secrets that can only be decrypted by the Sealed Secrets controller.
# To create a sealed secret:
#   1. Create a regular Secret YAML
#   2. Use kubeseal to encrypt it: kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#   3. Commit the sealed-secret.yaml to git
#
# Required secrets:
#   - paryty-db-credentials: PostgreSQL credentials (username, password)
#   - paryty-jwt-secret: JWT signing secret (minimum 32 bytes)
#   - paryty-api-keys: API keys for external services
#   - paryty-tls-certs: TLS certificates for mTLS
#
# Example (DO NOT commit unencrypted secrets):
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: paryty-db-credentials
#   namespace: paryty
# spec:
#   encryptedData:
#     username: AgBY3...
#     password: AgBY3...

# WARNING: This is a PLACEHOLDER secret. You MUST replace it with actual sealed secrets before deployment.
# To create a sealed secret:
#   1. Create a regular Secret YAML with real credentials
#   2. Use kubeseal to encrypt it: kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#   3. Commit the sealed-secret.yaml to git
apiVersion: v1
kind: Secret
metadata:
  name: paryty-db-credentials
  namespace: paryty
type: Opaque
stringData:
  username: "paryty"
  password: "CHANGE_ME_IN_PRODUCTION"  # MUST be changed before deployment
---
apiVersion: v1
kind: Secret
metadata:
  name: paryty-jwt-secret
  namespace: paryty
type: Opaque
stringData:
  secret: "CHANGE_ME_IN_PRODUCTION_MIN_32_BYTES_REQUIRED"  # MUST be changed before deployment
---
apiVersion: v1
kind: Secret
metadata:
  name: paryty-tls-certs
  namespace: paryty
type: kubernetes.io/tls
data:
  tls.crt: ""  # Base64 encoded certificate
  tls.key: ""  # Base64 encoded private key
  ca.crt: ""   # Base64 encoded CA certificate
