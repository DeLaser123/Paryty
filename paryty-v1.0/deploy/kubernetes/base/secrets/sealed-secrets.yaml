# =============================================================================
# PARYTY SECRETS — PLACEHOLDER VALUES
# =============================================================================
# WARNING: This file contains PLACEHOLDER values that MUST be replaced before
# deployment to any non-development environment.
#
# To generate real secrets:
#   1. DB password: openssl rand -base64 32
#   2. JWT secret: openssl rand -base64 64
#   3. TLS certs: Use cert-manager or generate with openssl
#
# For production: Use Sealed Secrets (kubeseal) or External Secrets Operator
# to encrypt secrets before committing to version control.
# =============================================================================

# Sealed Secrets for Paryty
# This file contains encrypted secrets that can only be decrypted by the Sealed Secrets controller.
# To create a sealed secret:
#   1. Create a regular Secret YAML
#   2. Use kubeseal to encrypt it: kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#   3. Commit the sealed-secret.yaml to git
#
# Required secrets:
#   - paryty-db-credentials: PostgreSQL credentials (username, password)
#   - paryty-jwt-secret: JWT signing secret (minimum 32 bytes)
#   - paryty-api-keys: API keys for external services
#   - paryty-tls-certs: TLS certificates for mTLS
#
# Example (DO NOT commit unencrypted secrets):
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: paryty-db-credentials
#   namespace: paryty
# spec:
#   encryptedData:
#     username: AgBY3...
#     password: AgBY3...

apiVersion: v1
kind: Secret
metadata:
  name: paryty-db-credentials
  namespace: paryty
  labels:
    app.kubernetes.io/component: secrets
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  username: "paryty"
  # Generate with: openssl rand -base64 32
  # For production: encrypt this file with kubeseal before committing
  password: ""  # Must be set via kubectl create secret or ExternalSecrets
---
apiVersion: v1
kind: Secret
metadata:
  name: paryty-jwt-secret
  namespace: paryty
  labels:
    app.kubernetes.io/component: secrets
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  # Generate with: openssl rand -base64 64
  # Minimum 32 bytes for HS256
  secret: ""  # Must be set via kubectl create secret or ExternalSecrets
---
# TLS certificates are managed by cert-manager (see tls/certificate.yaml).
# The paryty-tls Secret is auto-generated by cert-manager Certificate resources.
# Do NOT manually create this secret — it will be overwritten by cert-manager.
# apiVersion: v1
# kind: Secret
# metadata:
#   name: paryty-tls-certs
#   namespace: paryty
# type: kubernetes.io/tls
# data:
#   tls.crt: ""
#   tls.key: ""
#   ca.crt: ""
