apiVersion: apps/v1
kind: Deployment
metadata:
  name: paryty-enricher
  labels:
    app.kubernetes.io/component: enricher
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: enricher
  template:
    metadata:
      labels:
        app.kubernetes.io/component: enricher
    spec:
      containers:
        - name: enricher
          image: paryty/enricher:latest
          envFrom:
            - configMapRef:
                name: paryty-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep paryty-enricher"
            initialDelaySeconds: 10
            periodSeconds: 15
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: enricher
