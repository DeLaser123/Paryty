apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: paryty-agent
  labels:
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent
    spec:
      hostPID: true  # Required for eBPF kprobes on host processes
      # hostNetwork removed — agents report via gRPC, don't need host network (INF-03)
      containers:
        - name: agent
          image: paryty/agent:v1.0.0  # Pin to specific version, never use :latest
          ports:
            - containerPort: 9090
              name: grpc
          env:
            - name: PARYTY_CLUSTER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: paryty-config
                  key: CLUSTER_ADDR
            - name: PARYTY_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: paryty-config
                  key: LOG_LEVEL
            - name: PARYTY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paryty-agent-credentials
                  key: api-key
                  optional: true  # Agent can be configured post-deploy via set-api-key
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            # Minimal privileges for eBPF kprobe attachment (INF-03)
            capabilities:
              add:
                - NET_ADMIN   # Required for BPF_PROG_TYPE_SCHED_CLS
                - SYS_PTRACE  # Required for kprobe attachment on some kernels
                # SYS_ADMIN removed — not required for BPF_PROG_TYPE_KPROBE
            readOnlyRootFilesystem: true
            runAsNonRoot: false  # eBPF needs root for bpf() syscall
            allowPrivilegeEscalation: false  # Capabilities set at startup, no further escalation
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: proc
          hostPath:
            path: /proc  # Full /proc needed for kallsyms, PID lookup, net stats
        - name: sys
          hostPath:
            path: /sys   # Full /sys needed for BPF filesystem and kernel debug
      tolerations:
        - operator: Exists
