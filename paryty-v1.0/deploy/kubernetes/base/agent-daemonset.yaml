apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: paryty-agent
  labels:
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: agent
          image: paryty/agent:latest
          ports:
            - containerPort: 9090
              name: grpc
          env:
            - name: PARYTY_CLUSTER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: paryty-config
                  key: CLUSTER_ADDR
            - name: PARYTY_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: paryty-config
                  key: LOG_LEVEL
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            privileged: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
      tolerations:
        - operator: Exists
