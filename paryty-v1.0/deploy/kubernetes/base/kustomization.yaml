apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: paryty

resources:
  - namespace.yaml
  - secrets/sealed-secrets.yaml
  # Ingestion service
  - ingestion/deployment.yaml
  - ingestion/service.yaml
  - ingestion/hpa.yaml
  - ingestion/pdb.yaml
  # Pipeline service
  - pipeline/deployment.yaml
  - pipeline/service.yaml
  - pipeline/hpa.yaml
  - pipeline/pdb.yaml
  # Query service
  - query/deployment.yaml
  - query/service.yaml
  - query/hpa.yaml
  - query/pdb.yaml
  # Intelligence service
  - intelligence/deployment.yaml
  - intelligence/service.yaml
  - intelligence/hpa.yaml
  - intelligence/pdb.yaml
  # Frontend service
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/ingress.yaml
  - frontend/pdb.yaml

commonLabels:
  app.kubernetes.io/name: paryty
  app.kubernetes.io/part-of: paryty
  app.kubernetes.io/managed-by: kustomize

configMapGenerator:
  - name: paryty-config
    literals:
      - REDPANDA_URL=PLAINTEXT://redpanda:9092
      - DRAGONFLY_URL=redis://dragonfly:6379
      - QUESTDB_URL=postgres://paryty:paryty@questdb:8812/paryty
      - SEAWEEDFS_URL=http://seaweedfs:8333
      - INGESTION_ADDR=paryty-ingestion:8080
      - PIPELINE_ADDR=paryty-pipeline:8080
      - QUERY_ADDR=paryty-query:8080
      - INTELLIGENCE_ADDR=paryty-intelligence:50051
      - LOG_LEVEL=info
      - LOG_FORMAT=json
