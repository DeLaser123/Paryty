# Paryty V1.0 - Default Values
# This file contains the default configuration for all Paryty services.
# Override these values per environment using values-<env>.yaml files.

global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  namespace: paryty
  storage:
    redpanda:
      url: "PLAINTEXT://redpanda:9092"
    dragonfly:
      url: "redis://dragonfly:6379"
    questdb:
      url: "postgres://paryty:paryty@questdb:8812/paryty"
    seaweedfs:
      url: "http://seaweedfs:8333"
  logging:
    level: info
    format: json

# Ingestion Service
ingestion:
  enabled: true
  replicaCount: 2
  image:
    repository: paryty/paryty-ingestion
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    grpc:
      port: 8080
    health:
      port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Pipeline Service
pipeline:
  enabled: true
  replicaCount: 2
  image:
    repository: paryty/paryty-pipeline
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    grpc:
      port: 8080
    health:
      port: 8081
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Query Service
query:
  enabled: true
  replicaCount: 2
  image:
    repository: paryty/paryty-query
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    http:
      port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Intelligence Service
intelligence:
  enabled: true
  replicaCount: 2
  image:
    repository: paryty/paryty-intelligence
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    grpc:
      port: 50051
    http:
      port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Frontend Service
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: paryty/paryty-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    http:
      port: 3000
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - host: paryty.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: paryty-tls
        hosts:
          - paryty.example.com
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
