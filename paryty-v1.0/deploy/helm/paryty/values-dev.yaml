# Development Environment Values
# Minimal resources for local development

global:
  namespace: paryty-dev
  logging:
    level: debug
    format: text

ingestion:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2

