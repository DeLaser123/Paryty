apiVersion: v1
kind: Service
metadata:
  name: {{ include "paryty.fullname" . }}-pipeline
  labels:
    {{- include "paryty.labels" . | nindent 4 }}
    app.kubernetes.io/component: pipeline
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.grpc.port }}
      name: grpc
      targetPort: grpc
    - port: {{ .Values.service.health.port }}
      name: health
      targetPort: health
  selector:
    {{- include "paryty.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pipeline