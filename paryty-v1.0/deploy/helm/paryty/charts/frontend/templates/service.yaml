apiVersion: v1
kind: Service
metadata:
  name: {{ include "paryty.fullname" . }}-frontend
  labels:
    {{- include "paryty.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.http.port }}
      name: http
      targetPort: http
  selector:
    {{- include "paryty.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend