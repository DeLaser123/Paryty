replicaCount: 2
image:
  repository: paryty/paryty-query
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  http:
    port: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
pdb:
  enabled: true
  minAvailable: 1
nodeSelector: {}
tolerations: []
affinity: {}