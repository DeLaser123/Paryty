{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "paryty.fullname" . }}-query
  labels:
    {{- include "paryty.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "paryty.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: query
{{- end }}