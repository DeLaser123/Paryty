# Paryty Development Docker Compose
version: '3.8'

services:
  redpanda:
    image: docker.io/redpandadata/redpanda:latest
    ports:
      - "9092:9092"
      - "9644:9644"
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    security_opt:
      - label=disable
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda:8082
      - --schema-registry-addr
      - PLAINTEXT://0.0.0.0:8081
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    volumes:
      - D:/ParytyData/redpanda:/var/lib/redpanda/data

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ports:
      - "6379:6379"
    volumes:
      - D:/ParytyData/dragonfly:/data

  questdb:
    image: questdb/questdb:latest
    ports:
      - "9000:9000"  # PostgreSQL wire protocol
      - "9009:9009"  # Web console
      - "8812:8812"  # InfluxDB line protocol
    volumes:
      - D:/ParytyData/questdb:/var/lib/questdb

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - D:/ParytyData/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paryty
      POSTGRES_USER: paryty
      POSTGRES_PASSWORD: paryty

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    ports:
      - "9333:9333"  # Master server
      - "19333:19333"  # Master gRPC
    command: master -ip=seaweedfs-master -port=9333 -volumePreallocate=false
    volumes:
      - D:/ParytyData/seaweedfs-master:/data

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    ports:
      - "8080:8080"  # Volume server
      - "18080:18080"  # Volume gRPC
    command: volume -mserver=seaweedfs-master:9333 -port=8080 -publicUrl=localhost:8080
    volumes:
      - D:/ParytyData/seaweedfs-volume:/data
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    ports:
      - "8888:8888"  # Filer server
      - "18888:18888"  # Filer gRPC
    command: filer -master=seaweedfs-master:9333 -port=8888
    volumes:
      - D:/ParytyData/seaweedfs-filer:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    ports:
      - "8333:8333"  # S3 API gateway
    command: s3 -filer=seaweedfs-filer:8888 -port=8333
    depends_on:
      - seaweedfs-filer

  # --- Paryty Services ---

  paryty-agent:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.agent
    ports:
      - "9090:9090"  # gRPC
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      PARYTY_CLUSTER_ADDR: paryty-ingestion:8080
      PARYTY_LOG_LEVEL: info
    privileged: true
    pid: host
    depends_on:
      - paryty-ingestion

  paryty-ingestion:
    build:
      context: ../../cluster
      dockerfile: ../deploy/docker/Dockerfile.cluster
      args:
        SERVICE: ingestion
    ports:
      - "8080:8080"  # gRPC ingestion
      - "8081:8081"  # Health
    environment:
      PARYTY_REDPANDA_BROKERS: redpanda:9092
      PARYTY_DRAGONFLY_ADDR: dragonfly:6379
      PARYTY_QUESTDB_ADDR: questdb:8812
    depends_on:
      - redpanda
      - dragonfly
      - questdb

  paryty-query:
    build:
      context: ../../cluster
      dockerfile: ../deploy/docker/Dockerfile.cluster
      args:
        SERVICE: query
    ports:
      - "8082:8080"  # REST/WS/SSE API
    environment:
      PARYTY_REDPANDA_BROKERS: redpanda:9092
      PARYTY_DRAGONFLY_ADDR: dragonfly:6379
      PARYTY_QUESTDB_ADDR: questdb:8812
    depends_on:
      - redpanda
      - dragonfly
      - questdb

  paryty-pipeline:
    build:
      context: ../../cluster
      dockerfile: ../deploy/docker/Dockerfile.cluster
      args:
        SERVICE: pipeline
    environment:
      PARYTY_REDPANDA_BROKERS: redpanda:9092
      PARYTY_DRAGONFLY_ADDR: dragonfly:6379
      PARYTY_QUESTDB_ADDR: questdb:8812
      PARYTY_SEAWEEDFS_ENDPOINT: seaweedfs-s3:8333
      PARYTY_SEAWEEDFS_ACCESS_KEY: ""
      PARYTY_SEAWEEDFS_SECRET_KEY: ""
      PARYTY_SEAWEEDFS_BUCKET: paryty
      PARYTY_SEAWEEDFS_USE_SSL: "false"
    depends_on:
      - redpanda
      - dragonfly
      - questdb
      - seaweedfs-s3
    healthcheck:
      test: ["CMD", "/app/service", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  paryty-frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - paryty-query

  # --- Phase 6: Intelligence Layer ---

  paryty-intelligence:
    build:
      context: ../../intelligence
      dockerfile: Dockerfile
    ports:
      - "50051:50051"  # gRPC intelligence service
    environment:
      INTELLIGENCE_PORT: "50051"
      QUESTDB_HOST: questdb
      QUESTDB_PORT: "8812"
      QUESTDB_DATABASE: paryty
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: "6379"
      LOG_LEVEL: info
    volumes:
      - D:/ParytyData/intelligence/models:/data/models
      - ../../configs/intelligence/intelligence.yaml:/app/config/intelligence.yaml:ro
    depends_on:
      - questdb
      - dragonfly
      - redpanda
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch = grpc.insecure_channel('localhost:50051'); ch.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Gai-Tech Linux Agent (Phase 6 validation tenant)
  paryty-agent-gai-tech:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.agent
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ../../configs/agent/agent-gai-tech-linux.yaml:/app/config/agent.yaml:ro
    environment:
      PARYTY_CLUSTER_ADDR: paryty-ingestion:50052
      PARYTY_LOG_LEVEL: info
      PARYTY_TENANT_ID: gai-tech
    privileged: true
    pid: host
    depends_on:
      - paryty-ingestion

volumes:
  # Named volumes kept for services that don't need D: drive persistence
  # All data volumes now use D:/ParytyData/ bind mounts above
  placeholder:
