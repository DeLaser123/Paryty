# Paryty Development Docker Compose
# Usage: podman-compose --env-file ../../.env.dev -f docker-compose.dev.yaml up -d
version: '3.8'

services:
  redpanda:
    image: docker.io/redpandadata/redpanda:latest
    ports:
      - "${PARYTY_PORT_REDPANDA_KAFKA}:9092"
      - "${PARYTY_PORT_REDPANDA_ADMIN}:9644"
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    security_opt:
      - label=disable
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda:8082
      - --schema-registry-addr
      - PLAINTEXT://0.0.0.0:8081
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    # ---- TLS (production) ----
    # Uncomment and add to the command list above to enable TLS on Redpanda:
    #   - --kafka-addr
    #   - SSL://0.0.0.0:9093
    #   - --advertise-kafka-addr
    #   - SSL://redpanda:9093
    #   - --pandaproxy-addr
    #   - TLS://0.0.0.0:8083
    #   - --advertise-pandaproxy-addr
    #   - TLS://redpanda:8083
    # Also mount TLS certs:
    #   volumes:
    #     - ./certs/redpanda:/etc/redpanda/certs:ro
    #   environment:
    #     - REDPANDA_RPK_TLS_KEY=/etc/redpanda/certs/redpanda.key
    #     - REDPANDA_RPK_TLS_CERT=/etc/redpanda/certs/redpanda.crt
    #     - REDPANDA_RPK_TLS_TRUSTSTORE=/etc/redpanda/certs/ca.crt
    volumes:
      - /mnt/d/ParytyData/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ports:
      - "${PARYTY_PORT_DRAGONFLY}:6379"
    # ---- TLS (production) ----
    # To enable TLS, add these arguments to the dragonfly command:
    #   command: >
    #     dragonfly --tls
    #     --tls_cert_file=/etc/dragonfly/certs/server.crt
    #     --tls_key_file=/etc/dragonfly/certs/server.key
    #     --requirepass=${PARYTY_DRAGONFLY_PASSWORD}
    #   volumes:
    #     - ./certs/dragonfly:/etc/dragonfly/certs:ro
    #     - /mnt/d/ParytyData/dragonfly:/data
    volumes:
      - /mnt/d/ParytyData/dragonfly:/data

  questdb:
    image: questdb/questdb:latest
    ports:
      - "${PARYTY_PORT_QUESTDB_WEB}:9000"  # Web console + REST
      - "${PARYTY_PORT_QUESTDB_ILP}:9009"  # InfluxDB line protocol
      - "${PARYTY_PORT_QUESTDB_PG}:8812"   # PostgreSQL wire protocol
    # ---- TLS (production) ----
    # QuestDB supports TLS on the PostgreSQL wire protocol port.
    # To enable, set these environment variables:
    #   environment:
    #     - QDB_PG_TLS_ENABLED=true
    #     - QDB_PG_TLS_CERT_PATH=/etc/questdb/certs/server.crt
    #     - QDB_PG_TLS_PRIVATE_KEY_PATH=/etc/questdb/certs/server.key
    #   volumes:
    #     - ./certs/questdb:/etc/questdb/certs:ro
    #     - questdb_data:/var/lib/questdb
    volumes:
      - questdb_data:/var/lib/questdb
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    ports:
      - "${PARYTY_PORT_POSTGRES}:5432"
    # ---- TLS (production) ----
    # PostgreSQL supports TLS natively. To enable, add:
    #   command: >
    #     postgres -c ssl=on
    #     -c ssl_cert_file=/etc/postgres/certs/server.crt
    #     -c ssl_key_file=/etc/postgres/certs/server.key
    #   volumes:
    #     - ./certs/postgres:/etc/postgres/certs:ro
    #     - postgres_data:/var/lib/postgresql/data
    # Then change DATABASE_URL from ?sslmode=disable to ?sslmode=verify-full
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paryty
      POSTGRES_USER: paryty
      POSTGRES_PASSWORD: paryty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paryty -d paryty"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    ports:
      - "${PARYTY_PORT_SWFS_MASTER}:9333"        # Master server
      - "${PARYTY_PORT_SWFS_MASTER_GRPC}:19333"   # Master gRPC
    command: master -ip=seaweedfs-master -port=9333 -volumePreallocate=false
    volumes:
      - /mnt/d/ParytyData/seaweedfs-master:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    ports:
      - "${PARYTY_PORT_SWFS_VOLUME}:8080"        # Volume server (was 8080, now 18080)
      - "${PARYTY_PORT_SWFS_VOLUME_GRPC}:18080"   # Volume gRPC
    command: volume -mserver=seaweedfs-master:9333 -port=8080 -publicUrl=localhost:${PARYTY_PORT_SWFS_VOLUME}
    volumes:
      - /mnt/d/ParytyData/seaweedfs-volume:/data
    depends_on:
      - seaweedfs-master
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q :1F90"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    ports:
      - "${PARYTY_PORT_SWFS_FILER}:8888"        # Filer server
      - "${PARYTY_PORT_SWFS_FILER_GRPC}:18888"   # Filer gRPC
    command: filer -master=seaweedfs-master:9333 -port=8888
    volumes:
      - /mnt/d/ParytyData/seaweedfs-filer:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    ports:
      - "${PARYTY_PORT_SWFS_S3}:8333"  # S3 API gateway
    command: s3 -filer=seaweedfs-filer:8888 -port=8333
    # ---- TLS (production) ----
    # To enable HTTPS on the S3 gateway, add these flags to the command:
    #   command: s3 -filer=seaweedfs-filer:8888 -port=8333
    #     -cert=/etc/seaweedfs/certs/server.crt
    #     -key=/etc/seaweedfs/certs/server.key
    #   volumes:
    #     - ./certs/seaweedfs:/etc/seaweedfs/certs:ro
    depends_on:
      - seaweedfs-filer
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Paryty Services ---

  paryty-ingestion:
    image: paryty/ingestion:latest
    ports:
      - "${PARYTY_PORT_INGESTION}:8080"  # gRPC ingestion
    environment:
      DATABASE_URL: postgres://paryty:paryty@postgres:5432/paryty?sslmode=disable
      PARYTY_INGESTION_PORT: "8080"
      PARYTY_REDPANDA_BROKERS: redpanda:9092
      PARYTY_DRAGONFLY_ADDR: dragonfly:6379
      PARYTY_QUESTDB_ADDR: questdb:8812
      PARYTY_QUESTDB_ILP_ADDR: questdb:9009
      PARYTY_SEAWEEDFS_ENDPOINT: seaweedfs-s3:8333
      PARYTY_QUESTDB_USERNAME: "${PARYTY_QUESTDB_USERNAME:-admin}"
      PARYTY_QUESTDB_PASSWORD: "${PARYTY_QUESTDB_PASSWORD:-quest}"
    volumes:
      - ../../configs/cluster/cluster.yaml:/app/configs/cluster/cluster.yaml:ro
    depends_on:
      - redpanda
      - dragonfly
      - questdb
      - seaweedfs-s3
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  paryty-query:
    image: paryty/query:latest
    ports:
      - "${PARYTY_PORT_QUERY}:8080"  # REST/WS/SSE API
    environment:
      DATABASE_URL: postgres://paryty:paryty@postgres:5432/paryty?sslmode=disable
      PARYTY_JWT_SECRET: "${PARYTY_JWT_SECRET}"
      PARYTY_DEV_MODE: "true"
      PARYTY_REDPANDA_BROKERS: redpanda:9092
      PARYTY_DRAGONFLY_ADDR: dragonfly:6379
      PARYTY_QUESTDB_ADDR: questdb:8812
      PARYTY_QUESTDB_ILP_ADDR: questdb:9009
      PARYTY_QUESTDB_USERNAME: "${PARYTY_QUESTDB_USERNAME:-admin}"
      PARYTY_QUESTDB_PASSWORD: "${PARYTY_QUESTDB_PASSWORD:-quest}"
      PARYTY_SEAWEEDFS_ENDPOINT: seaweedfs-s3:8333
      PARYTY_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      PARYTY_INTELLIGENCE_ADDR: "paryty-intelligence:50051"
    volumes:
      - ../../configs/cluster/cluster.yaml:/app/configs/cluster/cluster.yaml:ro
      - ../../configs/cluster/plans.yaml:/app/configs/cluster/plans.yaml:ro
    depends_on:
      - redpanda
      - dragonfly
      - questdb
      - seaweedfs-s3
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  paryty-pipeline:
    image: paryty/pipeline:latest
    environment:
      PARYTY_REDPANDA_BROKERS: redpanda:9092
      PARYTY_DRAGONFLY_ADDR: dragonfly:6379
      PARYTY_QUESTDB_ADDR: questdb:8812
      PARYTY_QUESTDB_ILP_ADDR: questdb:9009
      PARYTY_SEAWEEDFS_ENDPOINT: seaweedfs-s3:8333
      PARYTY_SEAWEEDFS_ACCESS_KEY: "paryty-dev"
      PARYTY_SEAWEEDFS_SECRET_KEY: "paryty-dev-secret"
      PARYTY_SEAWEEDFS_BUCKET: paryty
      PARYTY_SEAWEEDFS_USE_SSL: "false"
      PARYTY_QUESTDB_USERNAME: "${PARYTY_QUESTDB_USERNAME:-admin}"
      PARYTY_QUESTDB_PASSWORD: "${PARYTY_QUESTDB_PASSWORD:-quest}"
    volumes:
      - ../../configs/cluster/cluster.yaml:/app/configs/cluster/cluster.yaml:ro
    depends_on:
      - redpanda
      - dragonfly
      - questdb
      - seaweedfs-s3
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /app/service"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # paryty-frontend:  # EXCLUDED — run natively via `npm run dev` in frontend/
  #   See .env.dev for VITE_API_URL / VITE_WS_URL settings.

  # --- Phase 6: Intelligence Layer ---

  paryty-intelligence:
    image: paryty-intelligence:latest
    ports:
      - "${PARYTY_PORT_INTELLIGENCE}:50051"  # gRPC intelligence service
    environment:
      INTELLIGENCE_PORT: "50051"
      QUESTDB_HOST: questdb
      QUESTDB_PORT: "8812"
      QUESTDB_DATABASE: paryty
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: "6379"
      LOG_LEVEL: info
      PARYTY_DEV_MODE: "true"
    volumes:
      - /mnt/d/ParytyData/intelligence/models:/data/models
      - ../../configs/intelligence/intelligence.yaml:/app/config/intelligence.yaml:ro
    depends_on:
      - questdb
      - dragonfly
      - redpanda
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch = grpc.insecure_channel('localhost:50051'); ch.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  questdb_data:
  postgres_data:
