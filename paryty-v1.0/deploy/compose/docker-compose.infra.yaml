# Paryty Infrastructure-Only Compose
# Contains only infrastructure services (no Paryty application services)
# Use this for development when you want to run Paryty services locally (outside containers)
#
# Usage: podman-compose --env-file ../../.env.dev -f docker-compose.infra.yaml up -d
# Verify: scripts/check-infra.ps1

version: '3.8'

services:
  redpanda:
    image: docker.io/redpandadata/redpanda:latest
    container_name: paryty-redpanda
    ports:
      - "${PARYTY_PORT_REDPANDA_KAFKA}:9092"     # Kafka API
      - "${PARYTY_PORT_REDPANDA_ADMIN}:9644"     # Admin API
      - "${PARYTY_PORT_REDPANDA_SCHEMA}:8081"    # Schema registry
      - "${PARYTY_PORT_REDPANDA_PROXY}:8082"     # Pandaproxy
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    security_opt:
      - label=disable
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://localhost:8082
      - --schema-registry-addr
      - PLAINTEXT://0.0.0.0:8081
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - localhost:33145
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--api-urls", "localhost:9644"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: paryty-dragonfly
    ports:
      - "${PARYTY_PORT_DRAGONFLY}:6379"
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  questdb:
    image: questdb/questdb:latest
    container_name: paryty-questdb
    ports:
      - "${PARYTY_PORT_QUESTDB_WEB}:9000"     # Web console
      - "${PARYTY_PORT_QUESTDB_ILP}:9009"     # InfluxDB line protocol
      - "${PARYTY_PORT_QUESTDB_PG}:8812"      # PostgreSQL wire protocol
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: paryty-seaweedfs-master
    ports:
      - "${PARYTY_PORT_SWFS_MASTER}:9333"
    command: master -ip=seaweedfs-master -port=9333 -volumePreallocate=false
    volumes:
      - seaweedfs-master-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: paryty-seaweedfs-volume
    ports:
      - "${PARYTY_PORT_SWFS_VOLUME}:8080"
    command: volume -mserver=seaweedfs-master:9333 -port=8080 -publicUrl=localhost:${PARYTY_PORT_SWFS_VOLUME}
    volumes:
      - seaweedfs-volume-data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: paryty-seaweedfs-filer
    ports:
      - "${PARYTY_PORT_SWFS_FILER}:8888"
    command: filer -master=seaweedfs-master:9333 -port=8888
    volumes:
      - seaweedfs-filer-data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_started

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: paryty-seaweedfs-s3
    ports:
      - "${PARYTY_PORT_SWFS_S3}:8333"
    command: s3 -filer=seaweedfs-filer:8888 -port=8333
    depends_on:
      seaweedfs-filer:
        condition: service_started

volumes:
  redpanda-data:
  dragonfly-data:
  questdb-data:
  seaweedfs-master-data:
  seaweedfs-volume-data:
  seaweedfs-filer-data:
