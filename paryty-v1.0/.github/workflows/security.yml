# Paryty Security Scanning Pipeline
# Runs security scans on schedule and on demand

name: Security

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Secret Detection
  # ──────────────────────────────────────────────────────────────
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Rust Security
  # ──────────────────────────────────────────────────────────────
  rust-security:
    name: Rust Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check licenses
        run: cargo deny check licenses

  # ──────────────────────────────────────────────────────────────
  # Go Security
  # ──────────────────────────────────────────────────────────────
  go-security:
    name: Go Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cluster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Static analysis
        run: gosec ./...

  # ──────────────────────────────────────────────────────────────
  # TypeScript Security
  # ──────────────────────────────────────────────────────────────
  typescript-security:
    name: TypeScript Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  # ──────────────────────────────────────────────────────────────
  # Container Security
  # ──────────────────────────────────────────────────────────────
  container-security:
    name: Container Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cluster image
        run: docker build -f deploy/docker/Dockerfile.cluster -t paryty-cluster:scan cluster/
      - name: Build frontend image
        run: docker build -f deploy/docker/Dockerfile.frontend -t paryty-frontend:scan frontend/
      - name: Scan cluster image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: paryty-cluster:scan
          format: 'sarif'
          output: 'trivy-cluster.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: paryty-frontend:scan
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-cluster.sarif'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend.sarif'

  # ──────────────────────────────────────────────────────────────
  # Dockerfile Linting
  # ──────────────────────────────────────────────────────────────
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint cluster Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.cluster
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.frontend
