# Paryty CI Pipeline
# Runs on every push and pull request

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Gate 1: Lint (Parallel)
  # ──────────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings

  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cluster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: cluster

  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint src/ --max-warnings 0

  # ──────────────────────────────────────────────────────────────
  # Gate 2: Build (Parallel)
  # ──────────────────────────────────────────────────────────────
  build-rust:
    name: Build Rust
    runs-on: ubuntu-latest
    needs: lint-rust
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release

  build-go:
    name: Build Go
    runs-on: ubuntu-latest
    needs: lint-go
    defaults:
      run:
        working-directory: cluster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build all services
        run: go build ./cmd/...

  build-typescript:
    name: Build TypeScript
    runs-on: ubuntu-latest
    needs: lint-typescript
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # Gate 3: Test (Sequential after Build)
  # ──────────────────────────────────────────────────────────────
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    needs: build-rust
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test
      - name: Doc tests
        run: cargo test --doc

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    needs: build-go
    defaults:
      run:
        working-directory: cluster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests with race detection
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: cluster/coverage.out

  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    needs: build-typescript
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx vitest run

  # ──────────────────────────────────────────────────────────────
  # Gate 4: Security (Parallel after Test)
  # ──────────────────────────────────────────────────────────────
  security-rust:
    name: Security Rust
    runs-on: ubuntu-latest
    needs: test-rust
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit
        run: cargo audit

  security-go:
    name: Security Go
    runs-on: ubuntu-latest
    needs: test-go
    defaults:
      run:
        working-directory: cluster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Vulnerability scan
        run: govulncheck ./...

  security-typescript:
    name: Security TypeScript
    runs-on: ubuntu-latest
    needs: test-typescript
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
