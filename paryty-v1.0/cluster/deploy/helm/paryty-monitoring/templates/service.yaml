apiVersion: v1
kind: Service
metadata:
  name: {{ include "paryty.name" . }}-monitoring
  labels:
    {{- include "paryty.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "paryty.selectorLabels" . | nindent 4 }}
    component: monitoring
