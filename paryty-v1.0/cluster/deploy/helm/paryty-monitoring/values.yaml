replicaCount: 1

image:
  repository: paryty-monitoring
  tag: latest
  pullPolicy: IfNotPresent

config:
  checkInterval: "30s"
  webhookURL: ""
  slos:
    - name: "query-api-availability"
      target: 99.9
      window: "30d"
    - name: "ingestion-availability"
      target: 99.9
      window: "30d"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
