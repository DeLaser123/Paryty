apiVersion: v1
kind: Service
metadata:
  name: {{ include "paryty.name" . }}-agent
  labels:
    {{- include "paryty.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "paryty.selectorLabels" . | nindent 4 }}
    component: agent
