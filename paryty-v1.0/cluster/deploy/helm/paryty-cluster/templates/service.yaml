apiVersion: v1
kind: Service
metadata:
  name: {{ include "paryty.name" . }}-query
  labels:
    {{- include "paryty.labels" . | nindent 4 }}
spec:
  type: {{ .Values.query.service.type }}
  ports:
    - port: {{ .Values.query.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "paryty.selectorLabels" . | nindent 4 }}
    component: query
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "paryty.name" . }}-ingestion
  labels:
    {{- include "paryty.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ingestion.service.type }}
  ports:
    - port: {{ .Values.ingestion.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "paryty.selectorLabels" . | nindent 4 }}
    component: ingestion
