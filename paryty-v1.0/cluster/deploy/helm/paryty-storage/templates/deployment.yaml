apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paryty.name" . }}-postgresql
  labels:
    {{- include "paryty.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "paryty.selectorLabels" . | nindent 6 }}
      component: postgresql
  template:
    metadata:
      labels:
        {{- include "paryty.selectorLabels" . | nindent 8 }}
        component: postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "paryty"
            - name: POSTGRES_USER
              value: "paryty"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paryty-postgresql
                  key: password
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "paryty.name" . }}-postgresql
---
