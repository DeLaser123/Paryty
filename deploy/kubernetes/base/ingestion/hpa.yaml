apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paryty-ingestion
  namespace: paryty
  labels:
    app.kubernetes.io/name: paryty-ingestion
    app.kubernetes.io/component: ingestion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paryty-ingestion
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
