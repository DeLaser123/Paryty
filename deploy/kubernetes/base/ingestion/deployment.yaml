apiVersion: apps/v1
kind: Deployment
metadata:
  name: paryty-ingestion
  namespace: paryty
  labels:
    app.kubernetes.io/name: paryty-ingestion
    app.kubernetes.io/component: ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paryty-ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paryty-ingestion
        app.kubernetes.io/component: ingestion
    spec:
      containers:
        - name: ingestion
          image: paryty/ingestion:latest
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          env:
            - name: PARYTY_CONFIG_PATH
              value: /etc/paryty/config.yaml
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paryty-secrets
                  key: database-url
            - name: PARYTY_TLS_CERT_FILE
              value: /etc/paryty/tls/tls.crt
            - name: PARYTY_TLS_KEY_FILE
              value: /etc/paryty/tls/tls.key
            - name: PARYTY_TLS_CA_FILE
              value: /etc/paryty/tls/ca.crt
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/paryty
              readOnly: true
            - name: tls
              mountPath: /etc/paryty/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: paryty-config
        - name: tls
          secret:
            secretName: paryty-tls
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
