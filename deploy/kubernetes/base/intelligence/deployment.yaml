apiVersion: apps/v1
kind: Deployment
metadata:
  name: paryty-intelligence
  namespace: paryty
  labels:
    app.kubernetes.io/name: paryty-intelligence
    app.kubernetes.io/component: intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paryty-intelligence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paryty-intelligence
        app.kubernetes.io/component: intelligence
    spec:
      containers:
        - name: intelligence
          image: paryty/intelligence:latest
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          env:
            - name: PARYTY_CONFIG_PATH
              value: /etc/paryty/config.yaml
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/paryty
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: paryty-config
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
