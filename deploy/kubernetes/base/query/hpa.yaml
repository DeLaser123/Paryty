apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paryty-query
  namespace: paryty
  labels:
    app.kubernetes.io/name: paryty-query
    app.kubernetes.io/component: query
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paryty-query
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
