apiVersion: apps/v1
kind: Deployment
metadata:
  name: paryty-query
  namespace: paryty
  labels:
    app.kubernetes.io/name: paryty-query
    app.kubernetes.io/component: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paryty-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paryty-query
        app.kubernetes.io/component: query
    spec:
      containers:
        - name: query
          image: paryty/query:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PARYTY_CONFIG_PATH
              value: /etc/paryty/config.yaml
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paryty-secrets
                  key: database-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/paryty
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: paryty-config
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
