apiVersion: apps/v1
kind: Deployment
metadata:
  name: paryty-frontend
  namespace: paryty
  labels:
    app.kubernetes.io/name: paryty-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paryty-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paryty-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: paryty/frontend:latest
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
